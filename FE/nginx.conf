server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The SPA shell (adapter-static fallback) is the directory index, so "/" boots the app.
    index 200.html;

    # Content-hashed SvelteKit assets — safe to cache aggressively.
    location /_app/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: every unknown path boots the client app (ADR-006).
    location / {
        try_files $uri $uri/ /200.html;
    }
}
