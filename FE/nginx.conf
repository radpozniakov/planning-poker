server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Vite emits index.html as the SPA entry point, so "/" boots the app.
    index index.html;

    # Native WebSocket upgrade -> the Node BE over the compose network. Must come before the
    # SPA fallback so a /ws upgrade reaches the BE instead of booting the client app.
    location /ws {
        proxy_pass http://be:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Keep idle game rooms alive (no app-level ping); well above any round's silence.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Surface the BE health probe through the same origin.
    location /health {
        proxy_pass http://be:3000;
    }

    # Content-hashed Vite assets — safe to cache aggressively.
    # Must stay above the SPA fallback so a missing asset returns 404, not the SPA shell.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: every unknown path boots the client app (ADR-006).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
