# Planning Picker — two services (ADR-006, Caddy removed).
#   docker compose up -d --build
#
# The FE container's nginx serves the static SPA and reverse-proxies /ws (+ /health) to the
# BE over the compose network, so only the FE is published. HTTPS/Caddy is dropped: on this
# host a front nginx (or direct LAN access) terminates TLS. Override the published port with
# HTTP_PORT (default 8080) -> http://<host>:8080.

services:
  be:
    build:
      context: .
      dockerfile: BE/Dockerfile
    environment:
      PORT: "3000" # must match the `be:3000` upstream in FE/nginx.conf
    expose:
      - "3000"
    restart: unless-stopped

  fe:
    build:
      context: .
      dockerfile: FE/Dockerfile
    depends_on:
      - be # fe's nginx proxies /ws to be:3000; ensure it's resolvable on start
    ports:
      - "${HTTP_PORT:-8080}:80"
    restart: unless-stopped
